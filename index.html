<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alex Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* BODY & BACKGROUND */
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(45deg, #00ff88, #00cc55, #66ff66, #009900, #66ff99);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite, fadeIn 1.2s ease;
    color:#fff;
    overflow-x:hidden;
}

@keyframes bgShift {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

@keyframes fadeIn {
    from {opacity:0; transform:scale(0.98);}
    to {opacity:1; transform:scale(1);}
}

/* HEADER */
header{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

header img{
    width:150px;
    height:150px;
    border-radius:50%;
    border:4px solid #00ff88;
    margin-bottom:20px;
    animation:spin 5s linear infinite;
}

@keyframes spin{
    from{transform:rotate(-5deg);}
    to{transform:rotate(5deg);}
}

header h1{
    font-size:60px;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    margin:0;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0deg);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

header p{
    font-size:20px;
    color:#e0ffe0;
}

/* SECTIONS */
section{
    padding:80px 10%;
}

/* PORTFOLIO */
.portfolio{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.video{
    background:white;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:black;
    font-weight:bold;
    font-size:22px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
    position:relative;
    overflow:hidden;
    transform:rotate(-2deg);
}

.video:hover{
    transform:scale(1.05) rotate(0deg);
    box-shadow:0 0 25px #00ff88;
}

.video:active{
    transform:scale(.95) rotate(3deg);
}

/* SCROLL ANIMATION */
.hidden{
    opacity:0;
    transform:translateY(40px) rotate(-2deg);
    transition:all 1s;
}
.show{
    opacity:1;
    transform:translateY(0) rotate(0deg);
}

/* MINI-GAME */
#game{
    background: rgba(0,50,0,0.6);
    border:2px solid #00ff88;
    height:300px;
    position:relative;
    overflow:hidden;
    margin-top:30px;
}

.skull{
    width:50px;
    height:50px;
    background: linear-gradient(45deg,#00ff88,#66ff66,#009900,#33cc33);
    position:absolute;
    border-radius:5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:24px;
}

/* BUTTON */
button{
    padding:12px 25px;
    border:none;
    background:#00ff88;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
    transition:.3s;
}
button:hover{
    background:#00cc55;
    transform:scale(1.1);
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    background:rgba(0,50,0,0.8);
    margin-top:50px;
}
</style>
</head>

<body>

<header>
<img src=/pfp>
<h1>Alex</h1>
<p>Minecraft-Themed Portfolio</p>
    <br>
<p> Minecraft Server Programmer for 7 years - Professional Expierence - My portfolio</p>
</header>

<section id="portfolio">
<h2>Portfolio</h2>
<div class="portfolio">
    <div class="video hidden">Placeholder Video 1</div>
    <div class="video hidden">Placeholder Video 2</div>
    <div class="video hidden">Placeholder Video 3</div>
</div>
    <br>
    <div class="portfolio">
    <div class="video hidden">Placeholder Video 4</div>
    <div class="video hidden">Placeholder Video 5</div>
    <div class="video hidden">Placeholder Video 6</div>
</div>
</section>



<footer>
<p>© 2026 Alex Portfolio. All rights reserved.</p>
</footer>

<script>
// Scroll animation
const hiddenElements = document.querySelectorAll('.hidden');
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
},{threshold:0.2});
hiddenElements.forEach(el=>observer.observe(el));

</script>
</body>
</html>
