<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alex Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:#e5e5e5;
    overflow-x:hidden;
    animation:fadeIn 1.2s ease;
}

/* ENTER ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:scale(0.98);}
    to{opacity:1; transform:scale(1);}
}

/* NAVBAR */
nav{
    position:fixed;
    width:100%;
    top:0;
    background:#111;
    padding:15px;
    border-bottom:2px solid #00ff88;
    z-index:999;
}
nav a{
    color:#8affb0;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}
nav a:hover{
    color:#00ff88;
    text-shadow:0 0 10px #00ff88;
}

/* HEADER */
header{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
}
header h1{
    font-size:70px;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    animation:float 3s infinite ease-in-out;
}
@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* SECTIONS */
section{
    padding:80px 10%;
}

/* PORTFOLIO */
.portfolio{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

/* VIDEO PLACEHOLDER */
.video{
    background:white;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:black;
    font-weight:bold;
    font-size:22px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
    position:relative;
    overflow:hidden;
}
.video:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00ff88;
}
.video:active{
    transform:scale(.95);
}

/* SCROLL ANIMATION */
.hidden{
    opacity:0;
    transform:translateY(40px);
    transition:all 1s;
}
.show{
    opacity:1;
    transform:translateY(0);
}

/* BUTTON */
button{
    padding:12px 25px;
    border:none;
    background:#00ff88;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
    transition:.3s;
}
button:hover{
    background:#00cc6a;
    transform:scale(1.1);
}

/* MINI-GAME */
#game{
    background:#111;
    border:2px solid #00ff88;
    height:300px;
    position:relative;
    overflow:hidden;
    margin-top:30px;
}

.creeper{
    width:50px;
    height:50px;
    background:#00ff88;
    position:absolute;
    border-radius:5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    background:#111;
    margin-top:50px;
}

</style>
</head>

<body>

<nav>
<a href="#home">Home</a>
<a href="#portfolio">Portfolio</a>
<a href="#game-section">Mini-game</a>
</nav>

<header id="home">
<h1>Alex</h1>
<p>Minecraft Themed Portfolio</p>
</header>

<section id="portfolio">
<h2>Portfolio</h2>
<div class="portfolio">
    <div class="video hidden">Placeholder</div>
    <div class="video hidden">Placeholder</div>
    <div class="video hidden">Placeholder</div>
</div>
</section>

<section id="game-section">
<h2>Mini-Game: Click the Creeper!</h2>
<p>Click the green creeper as fast as you can!</p>
<div id="game"></div>
<p>Score: <span id="score">0</span></p>
<button id="startGame">Start Game</button>
</section>

<footer>
<p>&copy; 2026 Alex Portfolio</p>
</footer>

<script>
// Scroll animation
const hiddenElements = document.querySelectorAll('.hidden');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});
hiddenElements.forEach(el => observer.observe(el));

// Mini-game logic
const game = document.getElementById('game');
const scoreDisplay = document.getElementById('score');
const startBtn = document.getElementById('startGame');
let score = 0;
let interval;

startBtn.addEventListener('click', () => {
    game.innerHTML = '';
    score = 0;
    scoreDisplay.textContent = score;

    interval = setInterval(() => {
        const creeper = document.createElement('div');
        creeper.classList.add('creeper');
        creeper.style.top = Math.random() * (game.clientHeight - 50) + 'px';
        creeper.style.left = Math.random() * (game.clientWidth - 50) + 'px';
        creeper.textContent = "💀";

        creeper.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = score;
            creeper.remove();
        });

        game.appendChild(creeper);

        setTimeout(() => {
            if(creeper.parentNode) creeper.remove();
        }, 1500);

    }, 1000);

    setTimeout(() => {
        clearInterval(interval);
        alert('Game Over! Your score: ' + score);
    }, 20000); // 20 seconds game
});
</script>

</body>
</html>
